name: QQQ Iron Condor Daily Scan

on:
  schedule:
    # 13:35 UTC = 9:35am ET during EDT (Mar-Nov) / 8:35am ET during EST (Nov-Mar).
    # GitHub Actions cron can't shift for daylight saving, so this lands
    # slightly before or just after the 9:30am ET open depending on time of
    # year -- either way it's a pre-open/at-open scan as requested.
    - cron: "35 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run QQQ iron condor scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m qqq_iron_condor.scan

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Daily QQQ iron condor scan report"
          git push
