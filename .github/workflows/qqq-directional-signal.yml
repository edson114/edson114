name: QQQ Directional Signal (Calls/Puts)

on:
  schedule:
    # Every 30 minutes, roughly 9:30am-4:00pm ET (13:30-20:00 UTC covers
    # the EDT open through close; shifts ~1hr during EST -- same caveat as
    # the iron condor scan's cron, GitHub Actions cron can't shift for DST).
    - cron: "0,30 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run QQQ directional signal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m qqq_iron_condor.signal

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/signals/
          git diff --cached --quiet || git commit -m "QQQ directional signal report"
          git push
