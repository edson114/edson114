name: QQQ Directional Signal Backtest

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of 5-minute history to backtest (yfinance caps this at 60)"
        required: false
        default: "59"
      score_threshold:
        description: "Override Config.signal_score_threshold (blank = use the default, 0.30)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run directional signal backtest
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          SCORE_THRESHOLD: ${{ github.event.inputs.score_threshold }}
        run: |
          ARGS=(--lookback-days "$LOOKBACK_DAYS")
          if [ -n "$SCORE_THRESHOLD" ]; then
            ARGS+=(--score-threshold "$SCORE_THRESHOLD")
          fi
          python -m qqq_iron_condor.directional_backtest "${ARGS[@]}"

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/backtests/
          git diff --cached --quiet || git commit -m "QQQ directional signal backtest report"
          git push
